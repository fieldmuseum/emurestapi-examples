name: CI

on:
  push:
    branches: [main]
  pull_request:

# The integration tests are excluded from these jobs: they need credentials for
# a live EMu installation, which CI does not have.
jobs:
  php:
    name: PHP
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: php
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Check formatting
        run: composer lint

      - name: Run tests
        run: composer test

  node:
    name: Node
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: node/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test
